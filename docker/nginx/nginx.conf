events {
  worker_connections 1024;
}

http {
  # ── Logging ──────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Security headers ──────────────────────────────────────────────────────────
  add_header X-Frame-Options           "SAMEORIGIN"   always;
  add_header X-Content-Type-Options    "nosniff"      always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Referrer-Policy           "no-referrer-when-downgrade" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ── Gzip ──────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1000;

  # ── Rate limiting zones ───────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/m;

  # ── Upstream ──────────────────────────────────────────────────────────────────
  upstream eugym_api {
    server api:4000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name api.eugym.ng eugym.ng;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.eugym.ng;

    ssl_certificate     /etc/letsencrypt/live/api.eugym.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eugym.ng/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── API proxy ───────────────────────────────────────────────────────────────
    location /api/v1/auth {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass         http://eugym_api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
    }

    location /api/v1/subscriptions/webhook {
      limit_req zone=webhook burst=30 nodelay;
      proxy_pass http://eugym_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass         http://eugym_api;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /health {
      proxy_pass http://eugym_api;
    }
  }
}
